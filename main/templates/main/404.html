<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .error-page {
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;
        padding: 20px;
      }

      .error-code {
        font-size: 120px;
        font-weight: bold;
        color: #555;
      }

      .error-title {
        font-size: 32px;
        margin-bottom: 15px;
      }

      .error-text {
        font-size: 18px;
        color: #777;
        margin-bottom: 30px;
      }

      .home-button {
        text-decoration: none;

        background-color: #333;
        color: white;

        padding: 12px 24px;
        border-radius: 6px;

        transition: 0.2s;
      }

      .home-button:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <main class="error-page">
      <h1 class="error-code">404</h1>

      <h2 class="error-title">Страница не найдена</h2>

      <p class="error-text">
        Возможно, страница была удалена или вы перешли по неправильному адресу.
      </p>

      <a href="/" class="home-button"> Вернуться на главную </a>
    </main>
  </body>
</html>
